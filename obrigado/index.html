<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirection…</title>
  <script src="/js/ds24-thankyou.js"></script>
  <script src="/learn/js/learn-config.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #444;
    }
  </style>
</head>
<body>
  <p>Redirection en cours…</p>
  <script>
    (function () {
      var qs = window.location.search || "";
      var params = new URLSearchParams(qs);
      var cfg = window.LEARN_CONFIG || { pages: {} };

      function isLearnFunnel() {
        if (params.get("funnel") === "learn") return true;
        try {
          if (sessionStorage.getItem("ttk:ds24_pending") === "1") return true;
          if (sessionStorage.getItem("ttk:funnel") === "learn") return true;
        } catch (e) {}
        return false;
      }

      var learnNext = {
        up1: cfg.pages && cfg.pages.up2,
        up2: cfg.pages && cfg.pages.up3,
        up3: cfg.pages && cfg.pages.final,
      };

      var appNext = {
        up1: "/app/up2/",
        up2: "/app/up3/",
        up3: "/app/merci/",
      };

      function cleanQuery() {
        var next = new URLSearchParams(qs);
        next.delete("funnel");
        next.delete("step");
        next.delete("sha_sign");
        var q = next.toString();
        return q ? "?" + q : "";
      }

      function redirect() {
        var learn = isLearnFunnel();
        var step = params.get("step") || "";
        var nextMap = learn ? learnNext : appNext;
        var next = step && nextMap[step];

        try {
          sessionStorage.removeItem("ttk:funnel");
        } catch (e) {}

        if (next) {
          window.location.replace(next + cleanQuery());
          return;
        }

        if (learn) {
          window.location.replace("/learn/merci/" + qs);
          return;
        }

        window.location.replace("/app/merci/" + qs);
      }

      // DS24 thank-you pixel precisa carregar nesta URL antes do redirect.
      setTimeout(redirect, 1200);
    })();
  </script>
</body>
</html>
