<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirection…</title>
  <script src="/js/ds24-thankyou.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #444;
    }
  </style>
</head>
<body>
  <p>Redirection en cours…</p>
  <script>
    (function () {
      var qs = window.location.search || "";
      var params = new URLSearchParams(qs);
      var isLearn =
        params.get("funnel") === "learn" ||
        (function () {
          try {
            return sessionStorage.getItem("ttk:ds24_pending") === "1";
          } catch (e) {
            return false;
          }
        })();

      function redirect() {
        if (isLearn) {
          window.location.replace("/learn/merci/" + qs);
          return;
        }
        window.location.replace("/app/merci/" + qs);
      }

      // DS24 thank-you pixel precisa carregar nesta URL antes do redirect.
      setTimeout(redirect, 1200);
    })();
  </script>
</body>
</html>
