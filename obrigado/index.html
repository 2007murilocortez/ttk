<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirection…</title>
  <script src="/js/ds24-thankyou.js"></script>
  <script src="/learn/js/learn-config.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #444;
    }
  </style>
</head>
<body>
  <p>Redirection en cours…</p>
  <script>
    (function () {
      var qs = window.location.search || "";
      var params = new URLSearchParams(qs);
      var cfg = window.LEARN_CONFIG || { pages: {} };
      var isLearn =
        params.get("funnel") === "learn" ||
        params.has("step") ||
        (function () {
          try {
            return sessionStorage.getItem("ttk:ds24_pending") === "1";
          } catch (e) {
            return false;
          }
        })();

      var upsellNext = {
        up1: cfg.pages && cfg.pages.up2,
        up2: cfg.pages && cfg.pages.up3,
        up3: cfg.pages && cfg.pages.final,
      };

      function cleanQuery() {
        var next = new URLSearchParams(qs);
        next.delete("funnel");
        next.delete("step");
        next.delete("sha_sign");
        var q = next.toString();
        return q ? "?" + q : "";
      }

      function redirect() {
        if (!isLearn) {
          window.location.replace("/app/merci/" + qs);
          return;
        }

        var step = params.get("step") || "";
        if (step && upsellNext[step]) {
          window.location.replace(upsellNext[step] + cleanQuery());
          return;
        }

        window.location.replace("/learn/merci/" + qs);
      }

      // DS24 thank-you pixel precisa carregar nesta URL antes do redirect.
      setTimeout(redirect, 1200);
    })();
  </script>
</body>
</html>
