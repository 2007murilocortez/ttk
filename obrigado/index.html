<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Paiement confirmé</title>
  <script src="/js/ds24-thankyou.js"></script>
  <script src="/learn/js/learn-config.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #222;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      text-align: center;
      line-height: 1.55;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: #555; margin: 0 0 16px; }
    a.btn {
      display: inline-block;
      padding: 12px 20px;
      background: #0c0c14;
      color: #9be8d3;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .fine { font-size: 13px; color: #777; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Paiement confirmé</h1>
    <p id="obrigado-msg">Votre commande a été enregistrée. Accédez à votre PDF via Digistore24.</p>
    <p><a class="btn" id="obrigado-continue" href="/app/merci/">Accéder à mon produit PDF</a></p>
    <p class="fine">Vous recevrez aussi un e-mail Digistore24 avec le lien de téléchargement. Vérifiez vos spams.</p>
  </div>
  <script>
    (function () {
      var qs = window.location.search || "";
      var params = new URLSearchParams(qs);
      var cfg = window.LEARN_CONFIG || { pages: {} };
      var step = params.get("step") || "";
      var continueEl = document.getElementById("obrigado-continue");

      function isLearnFunnel() {
        if (params.get("funnel") === "learn") return true;
        try {
          if (sessionStorage.getItem("ttk:ds24_pending") === "1") return true;
          if (sessionStorage.getItem("ttk:funnel") === "learn") return true;
        } catch (e) {}
        return false;
      }

      var learnNext = {
        up1: cfg.pages && cfg.pages.up3,
        up2: cfg.pages && cfg.pages.up3,
        up3: cfg.pages && cfg.pages.final,
      };

      function buildRedirect(path) {
        var url = new URL(path, window.location.origin);
        var extra = new URLSearchParams(qs);
        extra.delete("funnel");
        extra.delete("sha_sign");
        extra.forEach(function (value, key) {
          if (value && !url.searchParams.has(key)) {
            url.searchParams.set(key, value);
          }
        });
        return url.pathname + url.search + url.hash;
      }

      function redirect() {
        var learn = isLearnFunnel();

        try {
          sessionStorage.removeItem("ttk:funnel");
        } catch (e) {}

        if (step) {
          if (learn && learnNext[step]) {
            window.location.replace(buildRedirect(learnNext[step]));
            return;
          }
          if (!learn) {
            window.location.replace(buildRedirect("/app/merci/" + step + "/"));
            return;
          }
        }

        if (learn) {
          window.location.replace("/learn/merci/" + qs);
          return;
        }

        window.location.replace(buildRedirect("/app/merci/"));
      }

      if (step && !isLearnFunnel()) {
        continueEl.href = buildRedirect("/app/merci/" + step + "/");
        continueEl.textContent = "Accéder à mon PDF — étape suivante";
      } else if (step && isLearnFunnel() && learnNext[step]) {
        continueEl.href = buildRedirect(learnNext[step]);
        continueEl.textContent = "Continuer";
      }

      setTimeout(redirect, 2800);
    })();
  </script>
</body>
</html>
