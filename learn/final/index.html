<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Solde en cours de libération</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #ecfdf5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: #555; line-height: 1.6; font-size: 15px; }
    .amount {
      margin: 20px 0;
      font-size: 28px;
      font-weight: 700;
      color: #111;
    }
  </style>
  <script src="/learn/js/tt-pixel.js"></script>
  <script src="/learn/js/tt-bootstrap.js"></script>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Tout est confirmé</h1>
    <p>Votre demande a été enregistrée. Le solde sera crédité sur votre compte sous 24 à 48 h ouvrées.</p>
    <div class="amount">1.395,00 €</div>
    <p>Vous recevrez un e-mail de confirmation avec les détails.</p>
  </div>
</body>
</html>
