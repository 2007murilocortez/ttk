<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Paiement confirmé</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, sans-serif;
      background: #fff;
      color: #111;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #ecfdf5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #555; line-height: 1.5; font-size: 15px; }
    .loader {
      margin-top: 24px;
      width: 36px;
      height: 36px;
      border: 3px solid #eee;
      border-top-color: #ff3b6c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-inline: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="/learn/js/tt-pixel.js"></script>
  <script src="/learn/js/tt-bootstrap.js"></script>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Paiement confirmé</h1>
    <p>Votre contribution a été reçue. Redirection vers la libération de votre solde…</p>
    <div class="loader" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      var qs = new URLSearchParams(window.location.search || "");
      var orderId = qs.get("order_id") || qs.get("order_item_id") || "";
      var email = qs.get("buyer_email") || qs.get("email") || "";

      function goNext() {
        var next = "/learn/up1.2/";
        var params = new URLSearchParams(window.location.search || "");
        var q = params.toString();
        window.location.replace(next + (q ? "?" + q : ""));
      }

      function run() {
        if (window.ttPixel && typeof window.ttPixel.completePayment === "function") {
          window.ttPixel.completePayment({ proof: orderId, email: email });
        }
        setTimeout(goNext, 1500);
      }

      if (window.ttq && typeof window.ttq.ready === "function") {
        window.ttq.ready(run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
